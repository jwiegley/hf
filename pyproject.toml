[project]
name = "hf"
version = "1.0.0"
description = "Model management utility for GGUF, MLX, LMStudio, and Ollama models"
requires-python = ">=3.11"
dependencies = ["requests>=2.32.4"]

[project.scripts]
hf = "hf:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["hf"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x -q --benchmark-disable"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
fail_under = 23

[tool.basedpyright]
pythonVersion = "3.11"
reportAny = false
